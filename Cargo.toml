[package]
name = "steampick"
version = "0.1.0"
edition = "2024"

[features]
server = ["dioxus/server", "dep:derivative", "dep:serde_with", "dep:nestruct", "dep:rand", "reqwest/blocking"]
desktop = ["dioxus/desktop", "dioxus/router"]

[dependencies]
atklib = { git = "https://github.com/Atakku/rs-atklib.git", rev = "147b219" }
dioxus = { version = "0.6", features = ["fullstack"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["default-tls"] }
nestruct = { version = "0.1.0", optional = true }
derivative = { version = "2.2", optional = true }
serde_with = { version = "3.8", optional = true }
rand = { version = "0.9", optional = true }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
