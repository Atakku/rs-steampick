[package]
name = "steampick"
version = "0.1.0"
edition = "2024"

[features]
server = ["dioxus/server"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { version = "0.6", features = ["fullstack"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["default-tls"] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
