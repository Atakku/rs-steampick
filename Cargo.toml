[workspace]
members = ["client", "server", "shared"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"

[profile.release]
opt-level = 3

[profile.release-max]
inherits = "release"
opt-level = "z"
debug = false
strip = true
lto = true
codegen-units = 1
panic = "abort"

[workspace.dependencies]
steampick.path = "shared"
atklib = { git = "https://github.com/Atakku/rs-atklib.git", rev = "147b219" }
eframe = "^0.33"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
tokio = { version = "^1.50", features = ["macros", "rt-multi-thread"] }
nestruct = "^0.1"
serde_with = "^3.18"
reqwest = { version = "^0.13", features = ["default-tls", "json"] }
axum = "^0.8"
open = "^5.3"
itertools = "^0.14"
scraper = "^0.26"
html-escape = "^0.2"
