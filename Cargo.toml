[workspace]
members = ["client", "server", "shared"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"

[profile.release]
opt-level = 3

[workspace.dependencies]
steampick.path = "shared"
atklib = { git = "https://github.com/Atakku/rs-atklib.git", rev = "147b219" }
eframe = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
nestruct = "0.1"
serde_with = "3.8"
reqwest = { version = "0.12", features = ["default-tls", "blocking", "json"] }
axum = "0.8"
open = "5.3"
